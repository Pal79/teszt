<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Matek Jegyzet</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; }
        .keplet { background: #f4f4f4; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Matematika összefoglaló</h1>
    <p>A másodfokú egyenlet megoldóképlete:</p>
    
    <div class="keplet">
        $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$
    </div>

    <p>Sorközi példa: Ha $a=1$, akkor az egyenlet egyszerűbb.</p>

</body>
</html>
